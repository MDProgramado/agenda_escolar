<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Espaço - Agenda Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="card-title mb-0" th:text="${espaco.id == null ? 'Novo Espaço' : 'Editar Espaço'}">Espaço</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/espacos/salvar}" th:object="${espaco}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome do Espaço <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{nome}" id="nome" class="form-control"
                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" placeholder="Ex: Laboratório de Informática 1" />
                            <div class="invalid-feedback" th:errors="*{nome}">Erro de validação</div>
                        </div>

                        <div class="mb-3">
                            <label for="capacidade" class="form-label">Capacidade Máxima <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{capacidade}" id="capacidade" class="form-control"
                                   th:classappend="${#fields.hasErrors('capacidade')} ? 'is-invalid'" placeholder="Ex: 40" />
                            <div class="invalid-feedback" th:errors="*{capacidade}">Erro de validação</div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="/espacos" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Salvar Espaço</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
